[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"
  logfile = ""
  debug = false
  quiet = false


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["factory/+/telemetry"]
  qos = 1
  connection_timeout = "30s"
  persistent_session = true
  client_id = "telegraf-local-dashboard"

  # Optional broker auth (used when running with docker-compose.secure.yml)
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry"

    # If your payload has an ISO timestamp like 2026-05-23T18:56:35.926779+00:00
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "factory_id"
      rename = "factory_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
      rename = "machine_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature_c"
      rename = "temperature_c"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "vibration_mm_s"
      rename = "vibration_mm_s"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rpm"
      rename = "rpm"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pressure_bar"
      rename = "pressure_bar"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      rename = "state"
      type = "string"


[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "sensorapp"
  skip_database_creation = false
