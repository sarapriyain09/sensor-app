persistence false

log_dest stdout

# Secure profile: disable anonymous access and require password auth.
# Create password file at ./docker/mosquitto/passwordfile (see docs).

per_listener_settings true
listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwordfile

# Scale-friendly defaults for demos
max_connections 1000
max_inflight_messages 50
max_queued_messages 10000
