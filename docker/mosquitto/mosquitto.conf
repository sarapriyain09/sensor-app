persistence false

log_dest stdout

# SECURITY NOTE:
# - This config is suitable for local development only.
# - docker-compose.yml binds the broker to 127.0.0.1 on the host.
# - For shared networks/production, set allow_anonymous false and configure a password_file.

allow_anonymous true

listener 1883 0.0.0.0

